name: Token Expiry Watchdog

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    name: Check winget token expiry
    runs-on: ubuntu-latest
    steps:
      - name: Read token expiration
        id: token
        env:
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          headers="$(gh api /user --include)"
          expiry="$(echo "$headers" | tr -d '\r' | sed -n 's/^GitHub-Authentication-Token-Expiration: //Ip')"
          echo "expiry=$expiry" >> "$GITHUB_OUTPUT"

      - name: Open reminder issue
        if: steps.token.outputs.expiry != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPIRY: ${{ steps.token.outputs.expiry }}
        run: |
          now="$(date +%s)"
          days=$(( (EXPIRY - now) / 86400 ))
          if [ "$days" -le 30 ]; then
            gh issue create \
              --title "WINGET_CREATE_GITHUB_TOKEN expires in $days days" \
              --body "The classic PAT stored as \`WINGET_CREATE_GITHUB_TOKEN\` expires on **$(date -d "@$EXPIRY" -u '+%Y-%m-%d')**.

            Regenerate it at https://github.com/settings/tokens (Tokens (classic), public_repo scope) and update the repo secret before the winget workflow starts failing."
          else
            echo "Token fine: $days days left"
          fi
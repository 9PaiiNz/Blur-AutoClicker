name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Extract changelog
        shell: pwsh
        run: |
          $version = [regex]::Escape(("${{ github.ref_name }}".TrimStart('v')))
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)# v$version .*?(?=\n# v|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            Set-Content -Path release_body.md -Value $match.Value.Trim()
          }

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BlurAutoClicker ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for details.
          releaseDraft: true

      - name: Update release body from changelog
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path release_body.md) {
            gh release edit "${{ github.ref_name }}" --notes-file release_body.md
          }

      - name: Create portable package
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/package-portable.ps1" `
            -RepoRoot "${{ github.workspace }}" `
            -Tag "${{ github.ref_name }}"

      - name: Upload portable package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The bare exe is an upgrade drop for EXISTING portable folders
          # (it has no marker/DLLs/bootstrapper); the zip is the full build.
          $portableExe = "BlurAutoClicker-${{ github.ref_name }}-portable.exe"
          Copy-Item "src-tauri/target/release/BlurAutoClicker.exe" $portableExe -Force
          gh release upload "${{ github.ref_name }}" `
            "BlurAutoClicker-${{ github.ref_name }}-portable.zip" `
            $portableExe `
            --clobber

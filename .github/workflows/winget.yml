name: Submit to WinGet

on:
  release:
    types: [published]

permissions:
  contents: read
  issues: write

jobs:
  winget:
    name: Submit to winget-pkgs
    runs-on: windows-latest
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
    steps:
      - name: Derive version (strip leading v from tag)
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          Write-Output "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Find NSIS installer asset
        id: asset
        shell: pwsh
        run: |
          $assets = '${{ toJSON(github.event.release.assets) }}' | ConvertFrom-Json
          $installer = $assets | Where-Object { $_.name -like '*_x64-setup.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer asset found' }
          Write-Output "url=$($installer.browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Download wingetcreate
        run: curl.exe -JLO https://aka.ms/wingetcreate/latest

      - name: Update manifest and submit PR
        shell: pwsh
        run: |
          .\wingetcreate.exe update Blur009.BlurAutoClicker `
            --version "${{ steps.version.outputs.version }}" `
            --urls "${{ steps.asset.outputs.url }}" `
            --submit

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create `
            --title "WinGet submission failed for ${{ github.event.release.tag_name }}" `
            --body "The winget-pkgs PR submission failed on release **${{ github.event.release.tag_name }}**.

          Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for logs.

          Common causes:
          - \`WINGET_CREATE_GITHUB_TOKEN\` secret is missing or expired.
          - The \`*_x64-setup.exe\` asset was not found on the release.
          - winget-pkgs rejected the manifest (see the PR if one was opened)."